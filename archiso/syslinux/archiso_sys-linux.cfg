LABEL voltos
TEXT HELP
Start the VoltOS live desktop (BIOS).  Use "Install VoltOS" on the
desktop to install VoltOS on a ZFS root (UEFI machines only).
ENDTEXT
MENU LABEL VoltOS live desktop (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL voltosram
TEXT HELP
Copy the whole medium into RAM first, so it can be removed after boot.
ENDTEXT
MENU LABEL VoltOS live desktop (%ARCH%, BIOS, copy to RAM)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram %KERNEL_PARAMS%
