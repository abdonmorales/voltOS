#
# pacman configuration used to build the VoltOS medium.  tools/build-iso.sh
# replaces @VOLTOS_REPO@ with the local package repository it just built.
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 8
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# VoltOS packages come first so they win over same-named Arch packages.
[voltos]
SigLevel = Optional TrustAll
Server = file://@VOLTOS_REPO@

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
