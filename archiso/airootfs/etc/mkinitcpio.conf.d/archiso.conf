# Live medium initramfs (local media boot; no network boot support).
#
# No kms hook: it copies every GPU driver and its firmware (NVIDIA's GSP
# firmware alone is ~100 MiB) into the initramfs, and the ISO carries the
# initramfs twice (ISO 9660 and the UEFI boot image), which pushed the ISO
# past GitHub's 2 GiB limit for release files.  udev loads the GPU drivers
# from the live root image moments later; until then the console uses the
# firmware framebuffer.
HOOKS=(base udev microcode modconf memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
