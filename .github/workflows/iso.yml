name: VoltOS ISO

on:
  push:
    branches: [main, 'dev-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A push to a dev-* branch cancels that branch's run still in progress;
# runs for main and tags are never cancelled (each has a group of its own).
concurrency:
  group: iso-${{ startsWith(github.ref, 'refs/heads/dev-') && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # contents: write publishes the package repository (main only).
    permissions:
      contents: write
    container:
      image: archlinux:latest
      # mkarchiso mounts file systems; QEMU uses /dev/kvm when present.
      options: --privileged

    steps:
      - name: Install git
        run: |
          pacman -Syu --noconfirm --needed git
          git config --global --add safe.directory '*'

      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: tools/install-build-deps.sh

      # Signs the packages and builds voltos-keyring when the repository has
      # the VOLTOS_REPO_KEY secret (tools/make-repo-key.sh).  Without it the
      # repository is unsigned and nothing is published.
      - name: Build packages (Nimbus, OpenZFS, ZFSBootMenu, VoltOS)
        env:
          REPO_KEY: ${{ secrets.VOLTOS_REPO_KEY }}
        run: |
          if [ -n "$REPO_KEY" ]; then
            (umask 077; printf '%s\n' "$REPO_KEY" > "$RUNNER_TEMP/repo.key")
            export VOLTOS_REPO_KEY_FILE="$RUNNER_TEMP/repo.key"
            echo "REPO_SIGNED=1" >> "$GITHUB_ENV"
          fi
          tools/build-packages.sh
          rm -f "$RUNNER_TEMP/repo.key"

      - name: Build the ISO
        id: iso
        run: tools/build-iso.sh

      # Signs the ISO for Secure Boot when the repository has the
      # VOLTOS_SB_KEY / VOLTOS_SB_CERT secrets (tools/make-secureboot-key.sh).
      # Forks and pull requests without them get an unsigned ISO.
      - name: Sign for Secure Boot
        env:
          SB_KEY: ${{ secrets.VOLTOS_SB_KEY }}
          SB_CERT: ${{ secrets.VOLTOS_SB_CERT }}
        run: |
          if [ -z "$SB_KEY" ] || [ -z "$SB_CERT" ]; then
            echo "No Secure Boot secrets: the ISO stays unsigned."
            exit 0
          fi
          umask 077
          printf '%s\n' "$SB_KEY" > "$RUNNER_TEMP/sb.key"
          printf '%s\n' "$SB_CERT" > "$RUNNER_TEMP/sb.crt"
          iso=$(ls out/voltos-*-x86_64.iso)
          VOLTOS_SB_KEY="$RUNNER_TEMP/sb.key" VOLTOS_SB_CERT="$RUNNER_TEMP/sb.crt" \
            tools/sign-iso.sh "$iso" "$iso.signed"
          mv "$iso.signed" "$iso"
          rm -f "$RUNNER_TEMP/sb.key"
          echo "SB_SIGNED=1" >> "$GITHUB_ENV"

      - name: Boot the signed ISO with Secure Boot enforced
        if: env.SB_SIGNED == '1'
        env:
          SB_CERT: ${{ secrets.VOLTOS_SB_CERT }}
        run: |
          printf '%s\n' "$SB_CERT" > "$RUNNER_TEMP/sb.crt"
          iso=$(ls out/voltos-*-x86_64.iso)
          SMOKE_SB_CERT="$RUNNER_TEMP/sb.crt" SMOKE_SCREENSHOT=out/live-secureboot.png \
            tools/smoke-qemu.sh live-secureboot "$iso"

      - name: Boot the live desktop (UEFI and BIOS)
        # Each test reports on its own: also after another one failed.
        if: ${{ !cancelled() && steps.iso.outcome == 'success' }}
        run: |
          iso=$(ls out/voltos-*-x86_64.iso)
          SMOKE_SCREENSHOT=out/live-uefi.png tools/smoke-qemu.sh live-uefi "$iso"
          tools/smoke-qemu.sh live-bios "$iso"

      # With a signed repository, the installed system must also fetch and
      # verify updates from it (the [voltos] repository).
      - name: Install to ZFS and boot through ZFSBootMenu
        # Each test reports on its own: also after another one failed.
        if: ${{ !cancelled() && steps.iso.outcome == 'success' }}
        run: |
          iso=$(ls out/voltos-*-x86_64.iso)
          [ "${REPO_SIGNED:-0}" = 1 ] && export SMOKE_REPO=out/repo
          # The installer also installs GNOME 2.32 in place of Flashback and
          # the science and engineering tools (downloaded: VoltOS's packages
          # from this build, Arch's from its mirrors); then the tools must
          # work, and GNOME 2.32 restart and power off the machine from its
          # shutdown dialog (gnome-session through logind).
          SMOKE_TIMEOUT=1800 SMOKE_GNOME2=1 SMOKE_EXTRAS=science,engineering \
            SMOKE_SCREENSHOT=out/installed.png tools/smoke-qemu.sh install "$iso"

      - name: Install with the graphical installer and boot the result
        # Each test reports on its own: also after another one failed.
        if: ${{ !cancelled() && steps.iso.outcome == 'success' }}
        run: |
          iso=$(ls out/voltos-*-x86_64.iso)
          # Choosing GNOME 2.32 on its account screen (downloaded from this
          # build's repository).
          [ "${REPO_SIGNED:-0}" = 1 ] && export SMOKE_REPO=out/repo SMOKE_GNOME2=1
          SMOKE_TIMEOUT=1800 SMOKE_SCREENSHOT=out/install-gui.png tools/smoke-qemu.sh install-gui "$iso"

      - name: Enable Secure Boot on an installed system and boot with it
        # Each test reports on its own: also after another one failed.
        if: ${{ !cancelled() && steps.iso.outcome == 'success' }}
        run: |
          iso=$(ls out/voltos-*-x86_64.iso)
          SMOKE_SECBOOT=1 SMOKE_SCREENSHOT=out/secureboot.png \
            tools/smoke-qemu.sh install "$iso"

      # Installed systems are not reinstalled between releases: install the
      # previous release's ISO, update it with pacman -Syu (VoltOS's packages
      # from this build, Arch's from its mirrors) and boot it again.
      - name: Upgrade an installation of the previous release
        if: ${{ !cancelled() && steps.iso.outcome == 'success' && env.REPO_SIGNED == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pacman -S --needed --noconfirm github-cli
          prev=$(gh api "repos/$GH_REPO/releases" --jq '.[] | select(.draft | not) | .tag_name' |
                 grep -E '^v[0-9]' | grep -vx "$GITHUB_REF_NAME" | sort -V | tail -n 1)
          if [ -z "$prev" ]; then
            echo "No earlier release to upgrade from."
            exit 0
          fi
          echo "Upgrading an installation of $prev"
          mkdir -p prev
          gh release download "$prev" --dir prev --pattern 'voltos-*-x86_64.iso'
          SMOKE_UPGRADE=1 SMOKE_REPO=out/repo SMOKE_SCREENSHOT=out/upgrade.png \
            tools/smoke-qemu.sh install "$(ls prev/voltos-*-x86_64.iso)"
          rm -rf prev

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          if-no-files-found: ignore
          path: out/*.png

      - name: Checksums
        run: |
          cd out
          sha256sum voltos-*-x86_64.iso > SHA256SUMS

      - name: Upload ISO and package repository
        uses: actions/upload-artifact@v4
        with:
          name: voltos-x86_64
          if-no-files-found: error
          path: |
            out/voltos-*-x86_64.iso
            out/SHA256SUMS
            out/*.png
            out/repo/

      # Installed systems update VoltOS's packages from this release
      # (tools/publish-repo.sh), only after every test above passed.
      - name: Publish the package repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.REPO_SIGNED == '1'
        env:
          REPO_KEY: ${{ secrets.VOLTOS_REPO_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pacman -S --needed --noconfirm github-cli
          (umask 077; printf '%s\n' "$REPO_KEY" > "$RUNNER_TEMP/repo.key")
          VOLTOS_REPO_KEY_FILE="$RUNNER_TEMP/repo.key" \
            tools/publish-repo.sh all out/repo repo-x86_64
          rm -f "$RUNNER_TEMP/repo.key"

  # AArch64: VoltOS for 64-bit ARM UEFI machines, built in an Arch Linux ARM
  # root.  VoltOS builds its own linux-lts there (Arch Linux ARM only has a
  # mainline kernel newer than OpenZFS supports) and ZFSBootMenu is built
  # locally with generate-zbm (there is no upstream AArch64 release EFI).
  aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 420
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create the Arch Linux ARM build root
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libarchive-tools
          sudo tools/alarm-buildroot.sh /var/tmp/alarm

      # OpenOffice takes hours to build from source on AArch64, so its own
      # workflow builds it (openoffice-aarch64.yml); this job takes that
      # package when its version is the recipe's, and does not build it.
      - name: Fetch OpenOffice built by its own workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(bash -c '. packages/openoffice/PKGBUILD; echo "$pkgver-$pkgrel"')
          f=openoffice-$v-aarch64.pkg.tar.zst
          mkdir -p out/repo-aarch64
          if gh release download openoffice-aarch64-build --pattern "$f" --dir out/repo-aarch64 --clobber; then
            echo "OpenOffice $v for aarch64: prebuilt"
          else
            echo "OpenOffice $v for aarch64 has not been built yet (run the OpenOffice for AArch64 workflow); the repository goes without it"
          fi

      # The key file sits in the checkout (bind-mounted at /voltos) only
      # while it is needed; out/ is not part of any artifact path.
      - name: Build packages (linux-lts, Nimbus, OpenZFS, ZFSBootMenu, VoltOS)
        env:
          REPO_KEY: ${{ secrets.VOLTOS_REPO_KEY }}
        run: |
          key=
          if [ -n "$REPO_KEY" ]; then
            sudo install -d -m 700 out/.key
            printf '%s\n' "$REPO_KEY" | sudo tee out/.key/repo.key >/dev/null
            key=VOLTOS_REPO_KEY_FILE=/voltos/out/.key/repo.key
            echo "REPO_SIGNED=1" >> "$GITHUB_ENV"
          fi
          sudo tools/alarm-chroot.sh /var/tmp/alarm "cd /voltos && $key VOLTOS_SKIP=openoffice tools/build-packages.sh"
          sudo rm -rf out/.key

      - name: Build the ZFS module with DKMS and ZFSBootMenu with generate-zbm
        run: |
          sudo tools/alarm-chroot.sh /var/tmp/alarm '
            set -e
            cd /voltos/out/repo-aarch64
            pacman -U --noconfirm linux-lts-6*.pkg.tar.zst linux-lts-headers-*.pkg.tar.zst \
              zfs-utils-*.pkg.tar.zst zfs-dkms-*.pkg.tar.zst \
              perl-boolean-*.pkg.tar.zst zfsbootmenu-*.pkg.tar.zst
            dkms status
            find /usr/lib/modules -name "zfs.ko*" | grep .
            # generate-zbm expects the EFI system partition mounted at
            # /boot/efi, as on installed systems; stand one in.
            mkdir -p /boot/efi
            mount -t tmpfs esp /boot/efi
            mkdir -p /boot/efi/EFI/zbm
            /usr/lib/voltos/voltos-zbm-generate
            ls -l /boot/efi/EFI/zbm /boot/efi/EFI/BOOT
            umount /boot/efi
            pacman -Rns --noconfirm zfsbootmenu perl-boolean zfs-dkms zfs-utils \
              linux-lts-headers linux-lts'

      - name: Build the ISO
        id: iso
        run: sudo tools/alarm-chroot.sh /var/tmp/alarm 'cd /voltos && tools/build-iso.sh'

      # As on x86_64, with Fedora's AArch64 shim (Microsoft UEFI CA 2023).
      - name: Sign for Secure Boot
        env:
          SB_KEY: ${{ secrets.VOLTOS_SB_KEY }}
          SB_CERT: ${{ secrets.VOLTOS_SB_CERT }}
        run: |
          if [ -z "$SB_KEY" ] || [ -z "$SB_CERT" ]; then
            echo "No Secure Boot secrets: the ISO stays unsigned."
            exit 0
          fi
          sudo apt-get install -yq xorriso mtools dosfstools sbsigntool
          umask 077
          printf '%s\n' "$SB_KEY" > "$RUNNER_TEMP/sb.key"
          printf '%s\n' "$SB_CERT" > "$RUNNER_TEMP/sb.crt"
          iso=$(ls out/voltos-*-aarch64.iso)
          sudo VOLTOS_SB_KEY="$RUNNER_TEMP/sb.key" VOLTOS_SB_CERT="$RUNNER_TEMP/sb.crt" \
            tools/sign-iso.sh "$iso" "$iso.signed"
          sudo mv "$iso.signed" "$iso"
          rm -f "$RUNNER_TEMP/sb.key"
          echo "SB_SIGNED=1" >> "$GITHUB_ENV"

      # QEMU on the runner: KVM when the runner offers it, otherwise TCG
      # (much slower, hence the long timeouts).
      - name: Install QEMU and AAVMF
        if: ${{ !cancelled() && steps.iso.outcome == 'success' }}
        run: |
          sudo apt-get install -yq qemu-system-arm qemu-efi-aarch64 qemu-utils socat imagemagick
          ls -l /dev/kvm 2>/dev/null || echo "no /dev/kvm: QEMU uses TCG"

      - name: Boot the signed ISO with Secure Boot enforced
        if: env.SB_SIGNED == '1'
        env:
          SB_CERT: ${{ secrets.VOLTOS_SB_CERT }}
        run: |
          sudo apt-get install -yq python3-pip
          sudo pip3 install --break-system-packages virt-firmware
          printf '%s\n' "$SB_CERT" > "$RUNNER_TEMP/sb.crt"
          iso=$(ls out/voltos-*-aarch64.iso)
          sudo -E SMOKE_TIMEOUT=3600 SMOKE_GUEST_WAIT=300 SMOKE_SB_CERT="$RUNNER_TEMP/sb.crt" \
            SMOKE_SCREENSHOT=out/aarch64-live-secureboot.png tools/smoke-qemu.sh live-secureboot "$iso"

      - name: Boot the live desktop (UEFI)
        # Each test reports on its own: also after another one failed.
        if: ${{ !cancelled() && steps.iso.outcome == 'success' }}
        run: |
          iso=$(ls out/voltos-*-aarch64.iso)
          sudo -E SMOKE_TIMEOUT=3600 SMOKE_GUEST_WAIT=300 SMOKE_APP_WAIT=60 \
            SMOKE_SCREENSHOT=out/aarch64-live.png tools/smoke-qemu.sh live-uefi "$iso"

      # The installed system boots with only a firmware framebuffer (ramfb),
      # the case that needs VoltOS's kernel to pass the framebuffer through
      # ZFSBootMenu's kexec; the live test above uses virtio-gpu.
      - name: Install to ZFS and boot through ZFSBootMenu
        # Each test reports on its own: also after another one failed.
        if: ${{ !cancelled() && steps.iso.outcome == 'success' }}
        run: |
          iso=$(ls out/voltos-*-aarch64.iso)
          repo=
          [ "${REPO_SIGNED:-0}" = 1 ] && repo=out/repo-aarch64
          sudo -E SMOKE_TIMEOUT=7200 SMOKE_GUEST_WAIT=300 SMOKE_GPU=ramfb SMOKE_REPO=$repo \
            SMOKE_SCREENSHOT=out/aarch64-installed.png tools/smoke-qemu.sh install "$iso"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-aarch64
          if-no-files-found: ignore
          path: out/aarch64-*.png

      - name: Checksums
        run: |
          # out/ was written as root inside the build root.
          cd out
          sha256sum voltos-*-aarch64.iso | sudo tee SHA256SUMS-aarch64

      - name: Upload ISO and package repository
        uses: actions/upload-artifact@v4
        with:
          name: voltos-aarch64
          if-no-files-found: error
          path: |
            out/voltos-*-aarch64.iso
            out/SHA256SUMS-aarch64
            out/repo-aarch64/

      # As on x86_64, after the tests above.  gh runs on the runner;
      # repo-add (in "prepare") runs in the Arch Linux ARM root.
      - name: Publish the package repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.REPO_SIGNED == '1'
        env:
          REPO_KEY: ${{ secrets.VOLTOS_REPO_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sudo chown -R "$(id -u)" out/repo-aarch64
          tools/publish-repo.sh list out/repo-aarch64 repo-aarch64
          sudo install -d -m 700 out/.key
          printf '%s\n' "$REPO_KEY" | sudo tee out/.key/repo.key >/dev/null
          sudo tools/alarm-chroot.sh /var/tmp/alarm \
            'cd /voltos && VOLTOS_REPO_KEY_FILE=/voltos/out/.key/repo.key tools/publish-repo.sh prepare out/repo-aarch64 repo-aarch64'
          sudo rm -rf out/.key
          sudo chown -R "$(id -u)" out/repo-aarch64
          tools/publish-repo.sh upload out/repo-aarch64 repo-aarch64

      # After publishing, so that this long test (another install, under TCG)
      # does not hold back package updates.  Secure Boot capable AAVMF in
      # Setup Mode: voltos-secureboot enrolls the owner's keys and signs
      # ZFSBootMenu and the kernel, then the machine boots with Secure Boot
      # enforced.
      - name: Enable Secure Boot on an installed system and boot with it
        # Each test reports on its own: also after another one failed.
        if: ${{ !cancelled() && steps.iso.outcome == 'success' }}
        run: |
          iso=$(ls out/voltos-*-aarch64.iso)
          sudo -E SMOKE_TIMEOUT=7200 SMOKE_GUEST_WAIT=300 SMOKE_GPU=ramfb SMOKE_SECBOOT=1 \
            SMOKE_SCREENSHOT=out/aarch64-secureboot.png tools/smoke-qemu.sh install "$iso"

      # The OpenSolaris graphical installer in its test mode, as on x86_64:
      # from the live desktop to the installed system's login screen.
      - name: Install with the graphical installer and boot the result
        # Also when the Secure Boot test failed: separate results.
        if: ${{ !cancelled() && steps.iso.outcome == 'success' }}
        run: |
          iso=$(ls out/voltos-*-aarch64.iso)
          sudo -E SMOKE_TIMEOUT=7200 SMOKE_GUEST_WAIT=300 \
            SMOKE_SCREENSHOT=out/aarch64-install-gui.png tools/smoke-qemu.sh install-gui "$iso"

      # As on x86_64: install the previous release's ISO and update it.
      # After publishing, like the tests above: the update rebuilds the ZFS
      # module with DKMS, which takes long under TCG.
      - name: Upgrade an installation of the previous release
        if: ${{ !cancelled() && steps.iso.outcome == 'success' && env.REPO_SIGNED == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prev=$(gh api "repos/$GH_REPO/releases" --jq '.[] | select(.draft | not) | .tag_name' |
                 grep -E '^v[0-9]' | grep -vx "$GITHUB_REF_NAME" | sort -V | tail -n 1)
          if [ -z "$prev" ]; then
            echo "No earlier release to upgrade from."
            exit 0
          fi
          echo "Upgrading an installation of $prev"
          mkdir -p prev
          gh release download "$prev" --dir prev --pattern 'voltos-*-aarch64.iso'
          sudo -E SMOKE_TIMEOUT=7200 SMOKE_GUEST_WAIT=300 SMOKE_UPGRADE_WAIT=10800 \
            SMOKE_GPU=ramfb SMOKE_UPGRADE=1 SMOKE_REPO=out/repo-aarch64 \
            SMOKE_SCREENSHOT=out/aarch64-upgrade.png \
            tools/smoke-qemu.sh install "$(ls prev/voltos-*-aarch64.iso)"
          rm -rf prev

      - name: Upload Secure Boot, graphical installer and upgrade screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-aarch64-secureboot-gui
          if-no-files-found: ignore
          path: |
            out/aarch64-secureboot*.png
            out/aarch64-install-gui*.png
            out/aarch64-upgrade*.png

  # Releases carry both ISOs.  0.x tags, and tags with a suffix such as
  # v1.0.0-rc1, are published as pre-releases.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, aarch64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: voltos-x86_64
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: voltos-aarch64
          path: artifacts
      # The checksum files are signed with the VoltOS package key (the one
      # installed systems trust for updates), so a download can be checked
      # against a key that does not come from the same place as the ISO.
      - name: Sign the checksums
        env:
          REPO_KEY: ${{ secrets.VOLTOS_REPO_KEY }}
        run: |
          if [ -z "$REPO_KEY" ]; then
            echo "No VOLTOS_REPO_KEY: the checksums stay unsigned."
            exit 0
          fi
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          printf '%s\n' "$REPO_KEY" | gpg --batch --quiet --import
          fpr=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr/ {print $10; exit}')
          cd artifacts
          for f in SHA256SUMS SHA256SUMS-aarch64; do
            gpg --batch --yes --armor --detach-sign --local-user "$fpr" --output "$f.asc" "$f"
            gpg --batch --verify "$f.asc" "$f"
          done
          gpg --batch --armor --export "$fpr" >voltos-signing-key.asc
          gpgconf --kill gpg-agent
          rm -rf "$GNUPGHOME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A failed earlier attempt can leave a draft release behind.
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>/dev/null)" = true ]; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          pre=
          case "$GITHUB_REF_NAME" in v0.*|*-*) pre=--prerelease ;; esac
          # The release's own section of NEWS.md ("## 0.2.0 ..." for v0.2.0).
          ver=${GITHUB_REF_NAME#v}
          awk -v v="$ver" '$1 == "##" { f = ($2 == v) ; next } f' source/NEWS.md >notes.md
          [ -s notes.md ] || echo "No section for $ver in NEWS.md." >notes.md
          gh release create "$GITHUB_REF_NAME" $pre --title "VoltOS $GITHUB_REF_NAME" \
            --notes "$(cat notes.md; echo; echo '---'; echo)VoltOS for x86_64 (UEFI and BIOS) and AArch64 (64-bit ARM with UEFI). Both ISOs are signed for Secure Boot when the signing secrets are set; otherwise turn Secure Boot off to boot them, and turn it on after installing with voltos-secureboot enable. AArch64 is newer and less tested. Check downloads against SHA256SUMS and SHA256SUMS-aarch64, whose signatures (.asc) are by the VoltOS signing key, fingerprint 5580 7487 EFAB 5F26 D4A3 2EFF 48A0 A16B EDE3 47A7." \
            --generate-notes artifacts/voltos-*.iso artifacts/SHA256SUMS artifacts/SHA256SUMS-aarch64 \
            $(ls artifacts/SHA256SUMS*.asc artifacts/voltos-signing-key.asc 2>/dev/null)
