name: VoltOS ISO

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # contents: write publishes the package repository (main only).
    permissions:
      contents: write
    container:
      image: archlinux:latest
      # mkarchiso mounts file systems; QEMU uses /dev/kvm when present.
      options: --privileged

    steps:
      - name: Install git
        run: |
          pacman -Syu --noconfirm --needed git
          git config --global --add safe.directory '*'

      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: tools/install-build-deps.sh

      # Signs the packages and builds voltos-keyring when the repository has
      # the VOLTOS_REPO_KEY secret (tools/make-repo-key.sh).  Without it the
      # repository is unsigned and nothing is published.
      - name: Build packages (Nimbus, OpenZFS, ZFSBootMenu, VoltOS)
        env:
          REPO_KEY: ${{ secrets.VOLTOS_REPO_KEY }}
        run: |
          if [ -n "$REPO_KEY" ]; then
            (umask 077; printf '%s\n' "$REPO_KEY" > "$RUNNER_TEMP/repo.key")
            export VOLTOS_REPO_KEY_FILE="$RUNNER_TEMP/repo.key"
            echo "REPO_SIGNED=1" >> "$GITHUB_ENV"
          fi
          tools/build-packages.sh
          rm -f "$RUNNER_TEMP/repo.key"

      - name: Build the ISO
        run: tools/build-iso.sh

      # Signs the ISO for Secure Boot when the repository has the
      # VOLTOS_SB_KEY / VOLTOS_SB_CERT secrets (tools/make-secureboot-key.sh).
      # Forks and pull requests without them get an unsigned ISO.
      - name: Sign for Secure Boot
        env:
          SB_KEY: ${{ secrets.VOLTOS_SB_KEY }}
          SB_CERT: ${{ secrets.VOLTOS_SB_CERT }}
        run: |
          if [ -z "$SB_KEY" ] || [ -z "$SB_CERT" ]; then
            echo "No Secure Boot secrets: the ISO stays unsigned."
            exit 0
          fi
          umask 077
          printf '%s\n' "$SB_KEY" > "$RUNNER_TEMP/sb.key"
          printf '%s\n' "$SB_CERT" > "$RUNNER_TEMP/sb.crt"
          iso=$(ls out/voltos-*-x86_64.iso)
          VOLTOS_SB_KEY="$RUNNER_TEMP/sb.key" VOLTOS_SB_CERT="$RUNNER_TEMP/sb.crt" \
            tools/sign-iso.sh "$iso" "$iso.signed"
          mv "$iso.signed" "$iso"
          rm -f "$RUNNER_TEMP/sb.key"
          echo "SB_SIGNED=1" >> "$GITHUB_ENV"

      - name: Boot the signed ISO with Secure Boot enforced
        if: env.SB_SIGNED == '1'
        env:
          SB_CERT: ${{ secrets.VOLTOS_SB_CERT }}
        run: |
          printf '%s\n' "$SB_CERT" > "$RUNNER_TEMP/sb.crt"
          iso=$(ls out/voltos-*-x86_64.iso)
          SMOKE_SB_CERT="$RUNNER_TEMP/sb.crt" SMOKE_SCREENSHOT=out/live-secureboot.png \
            tools/smoke-qemu.sh live-secureboot "$iso"

      - name: Boot the live desktop (UEFI and BIOS)
        run: |
          iso=$(ls out/voltos-*-x86_64.iso)
          SMOKE_SCREENSHOT=out/live-uefi.png tools/smoke-qemu.sh live-uefi "$iso"
          tools/smoke-qemu.sh live-bios "$iso"

      # With a signed repository, the installed system must also fetch and
      # verify updates from it (the [voltos] repository).
      - name: Install to ZFS and boot through ZFSBootMenu
        run: |
          iso=$(ls out/voltos-*-x86_64.iso)
          [ "${REPO_SIGNED:-0}" = 1 ] && export SMOKE_REPO=out/repo
          SMOKE_SCREENSHOT=out/installed.png tools/smoke-qemu.sh install "$iso"

      - name: Install with the graphical installer and boot the result
        run: |
          iso=$(ls out/voltos-*-x86_64.iso)
          SMOKE_SCREENSHOT=out/install-gui.png tools/smoke-qemu.sh install-gui "$iso"

      - name: Enable Secure Boot on an installed system and boot with it
        run: |
          iso=$(ls out/voltos-*-x86_64.iso)
          SMOKE_SECBOOT=1 SMOKE_SCREENSHOT=out/secureboot.png \
            tools/smoke-qemu.sh install "$iso"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          if-no-files-found: ignore
          path: out/*.png

      - name: Checksums
        run: |
          cd out
          sha256sum voltos-*-x86_64.iso > SHA256SUMS

      - name: Upload ISO and package repository
        uses: actions/upload-artifact@v4
        with:
          name: voltos-x86_64
          if-no-files-found: error
          path: |
            out/voltos-*-x86_64.iso
            out/SHA256SUMS
            out/*.png
            out/repo/

      # Installed systems update VoltOS's packages from this release
      # (tools/publish-repo.sh), only after every test above passed.
      - name: Publish the package repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.REPO_SIGNED == '1'
        env:
          REPO_KEY: ${{ secrets.VOLTOS_REPO_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pacman -S --needed --noconfirm github-cli
          (umask 077; printf '%s\n' "$REPO_KEY" > "$RUNNER_TEMP/repo.key")
          VOLTOS_REPO_KEY_FILE="$RUNNER_TEMP/repo.key" \
            tools/publish-repo.sh all out/repo repo-x86_64
          rm -f "$RUNNER_TEMP/repo.key"

  # AArch64: VoltOS for 64-bit ARM UEFI machines, built in an Arch Linux ARM
  # root.  VoltOS builds its own linux-lts there (Arch Linux ARM only has a
  # mainline kernel newer than OpenZFS supports) and ZFSBootMenu is built
  # locally with generate-zbm (there is no upstream AArch64 release EFI).
  aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 420
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create the Arch Linux ARM build root
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libarchive-tools
          sudo tools/alarm-buildroot.sh /var/tmp/alarm

      # The key file sits in the checkout (bind-mounted at /voltos) only
      # while it is needed; out/ is not part of any artifact path.
      - name: Build packages (linux-lts, Nimbus, OpenZFS, ZFSBootMenu, VoltOS)
        env:
          REPO_KEY: ${{ secrets.VOLTOS_REPO_KEY }}
        run: |
          key=
          if [ -n "$REPO_KEY" ]; then
            sudo install -d -m 700 out/.key
            printf '%s\n' "$REPO_KEY" | sudo tee out/.key/repo.key >/dev/null
            key=VOLTOS_REPO_KEY_FILE=/voltos/out/.key/repo.key
            echo "REPO_SIGNED=1" >> "$GITHUB_ENV"
          fi
          sudo tools/alarm-chroot.sh /var/tmp/alarm "cd /voltos && $key tools/build-packages.sh"
          sudo rm -rf out/.key

      - name: Build the ZFS module with DKMS and ZFSBootMenu with generate-zbm
        run: |
          sudo tools/alarm-chroot.sh /var/tmp/alarm '
            set -e
            cd /voltos/out/repo-aarch64
            pacman -U --noconfirm linux-lts-6*.pkg.tar.zst linux-lts-headers-*.pkg.tar.zst \
              zfs-utils-*.pkg.tar.zst zfs-dkms-*.pkg.tar.zst \
              perl-boolean-*.pkg.tar.zst zfsbootmenu-*.pkg.tar.zst
            dkms status
            find /usr/lib/modules -name "zfs.ko*" | grep .
            # generate-zbm expects the EFI system partition mounted at
            # /boot/efi, as on installed systems; stand one in.
            mkdir -p /boot/efi
            mount -t tmpfs esp /boot/efi
            mkdir -p /boot/efi/EFI/zbm
            /usr/lib/voltos/voltos-zbm-generate
            ls -l /boot/efi/EFI/zbm /boot/efi/EFI/BOOT
            umount /boot/efi
            pacman -Rns --noconfirm zfsbootmenu perl-boolean zfs-dkms zfs-utils \
              linux-lts-headers linux-lts'

      - name: Build the ISO
        run: sudo tools/alarm-chroot.sh /var/tmp/alarm 'cd /voltos && tools/build-iso.sh'

      # QEMU on the runner: KVM when the runner offers it, otherwise TCG
      # (much slower, hence the long timeouts).
      - name: Install QEMU and AAVMF
        run: |
          sudo apt-get install -yq qemu-system-arm qemu-efi-aarch64 qemu-utils socat imagemagick
          ls -l /dev/kvm 2>/dev/null || echo "no /dev/kvm: QEMU uses TCG"

      - name: Boot the live desktop (UEFI)
        run: |
          iso=$(ls out/voltos-*-aarch64.iso)
          sudo -E SMOKE_TIMEOUT=3600 SMOKE_GUEST_WAIT=300 SMOKE_APP_WAIT=60 \
            SMOKE_SCREENSHOT=out/aarch64-live.png tools/smoke-qemu.sh live-uefi "$iso"

      # The installed system boots with only a firmware framebuffer (ramfb),
      # the case that needs VoltOS's kernel to pass the framebuffer through
      # ZFSBootMenu's kexec; the live test above uses virtio-gpu.
      - name: Install to ZFS and boot through ZFSBootMenu
        run: |
          iso=$(ls out/voltos-*-aarch64.iso)
          repo=
          [ "${REPO_SIGNED:-0}" = 1 ] && repo=out/repo-aarch64
          sudo -E SMOKE_TIMEOUT=7200 SMOKE_GUEST_WAIT=300 SMOKE_GPU=ramfb SMOKE_REPO=$repo \
            SMOKE_SCREENSHOT=out/aarch64-installed.png tools/smoke-qemu.sh install "$iso"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-aarch64
          if-no-files-found: ignore
          path: out/aarch64-*.png

      - name: Checksums
        run: |
          # out/ was written as root inside the build root.
          cd out
          sha256sum voltos-*-aarch64.iso | sudo tee SHA256SUMS-aarch64

      - name: Upload ISO and package repository
        uses: actions/upload-artifact@v4
        with:
          name: voltos-aarch64
          if-no-files-found: error
          path: |
            out/voltos-*-aarch64.iso
            out/SHA256SUMS-aarch64
            out/repo-aarch64/

      # As on x86_64, after the tests above.  gh runs on the runner;
      # repo-add (in "prepare") runs in the Arch Linux ARM root.
      - name: Publish the package repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.REPO_SIGNED == '1'
        env:
          REPO_KEY: ${{ secrets.VOLTOS_REPO_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sudo chown -R "$(id -u)" out/repo-aarch64
          tools/publish-repo.sh list out/repo-aarch64 repo-aarch64
          sudo install -d -m 700 out/.key
          printf '%s\n' "$REPO_KEY" | sudo tee out/.key/repo.key >/dev/null
          sudo tools/alarm-chroot.sh /var/tmp/alarm \
            'cd /voltos && VOLTOS_REPO_KEY_FILE=/voltos/out/.key/repo.key tools/publish-repo.sh prepare out/repo-aarch64 repo-aarch64'
          sudo rm -rf out/.key
          sudo chown -R "$(id -u)" out/repo-aarch64
          tools/publish-repo.sh upload out/repo-aarch64 repo-aarch64

  # Releases carry both ISOs.  0.x tags, and tags with a suffix such as
  # v1.0.0-rc1, are published as pre-releases.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, aarch64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: voltos-x86_64
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: voltos-aarch64
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pre=
          case "$GITHUB_REF_NAME" in v0.*|*-*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" $pre --title "VoltOS $GITHUB_REF_NAME" \
            --notes "VoltOS for x86_64 (UEFI and BIOS) and AArch64 (64-bit ARM with UEFI). Only the x86_64 ISO is signed for Secure Boot (when the signing secrets are set); AArch64 is newer and less tested." \
            --generate-notes artifacts/voltos-*.iso artifacts/SHA256SUMS artifacts/SHA256SUMS-aarch64
