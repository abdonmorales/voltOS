name: VoltOS ISO

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: archlinux:latest
      # mkarchiso mounts file systems; QEMU uses /dev/kvm when present.
      options: --privileged

    steps:
      - name: Install git
        run: |
          pacman -Syu --noconfirm --needed git
          git config --global --add safe.directory '*'

      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: tools/install-build-deps.sh

      - name: Build packages (Nimbus, OpenZFS, ZFSBootMenu, VoltOS)
        run: tools/build-packages.sh

      - name: Build the ISO
        run: tools/build-iso.sh

      # Signs the ISO for Secure Boot when the repository has the
      # VOLTOS_SB_KEY / VOLTOS_SB_CERT secrets (tools/make-secureboot-key.sh).
      # Forks and pull requests without them get an unsigned ISO.
      - name: Sign for Secure Boot
        env:
          SB_KEY: ${{ secrets.VOLTOS_SB_KEY }}
          SB_CERT: ${{ secrets.VOLTOS_SB_CERT }}
        run: |
          if [ -z "$SB_KEY" ] || [ -z "$SB_CERT" ]; then
            echo "No Secure Boot secrets: the ISO stays unsigned."
            exit 0
          fi
          umask 077
          printf '%s\n' "$SB_KEY" > "$RUNNER_TEMP/sb.key"
          printf '%s\n' "$SB_CERT" > "$RUNNER_TEMP/sb.crt"
          iso=$(ls out/voltos-*-x86_64.iso)
          VOLTOS_SB_KEY="$RUNNER_TEMP/sb.key" VOLTOS_SB_CERT="$RUNNER_TEMP/sb.crt" \
            tools/sign-iso.sh "$iso" "$iso.signed"
          mv "$iso.signed" "$iso"
          rm -f "$RUNNER_TEMP/sb.key"
          echo "SB_SIGNED=1" >> "$GITHUB_ENV"

      - name: Boot the signed ISO with Secure Boot enforced
        if: env.SB_SIGNED == '1'
        env:
          SB_CERT: ${{ secrets.VOLTOS_SB_CERT }}
        run: |
          printf '%s\n' "$SB_CERT" > "$RUNNER_TEMP/sb.crt"
          iso=$(ls out/voltos-*-x86_64.iso)
          SMOKE_SB_CERT="$RUNNER_TEMP/sb.crt" SMOKE_SCREENSHOT=out/live-secureboot.png \
            tools/smoke-qemu.sh live-secureboot "$iso"

      - name: Boot the live desktop (UEFI and BIOS)
        run: |
          iso=$(ls out/voltos-*-x86_64.iso)
          SMOKE_SCREENSHOT=out/live-uefi.png tools/smoke-qemu.sh live-uefi "$iso"
          tools/smoke-qemu.sh live-bios "$iso"

      - name: Install to ZFS and boot through ZFSBootMenu
        run: |
          iso=$(ls out/voltos-*-x86_64.iso)
          SMOKE_SCREENSHOT=out/installed.png tools/smoke-qemu.sh install "$iso"

      - name: Install with the graphical installer and boot the result
        run: |
          iso=$(ls out/voltos-*-x86_64.iso)
          SMOKE_SCREENSHOT=out/install-gui.png tools/smoke-qemu.sh install-gui "$iso"

      - name: Enable Secure Boot on an installed system and boot with it
        run: |
          iso=$(ls out/voltos-*-x86_64.iso)
          SMOKE_SECBOOT=1 SMOKE_SCREENSHOT=out/secureboot.png \
            tools/smoke-qemu.sh install "$iso"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          if-no-files-found: ignore
          path: out/*.png

      - name: Checksums
        run: |
          cd out
          sha256sum voltos-*-x86_64.iso > SHA256SUMS

      - name: Upload ISO and package repository
        uses: actions/upload-artifact@v4
        with:
          name: voltos-x86_64
          if-no-files-found: error
          path: |
            out/voltos-*-x86_64.iso
            out/SHA256SUMS
            out/*.png
            out/repo/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: voltos-x86_64
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "VoltOS $GITHUB_REF_NAME" \
            --generate-notes artifacts/voltos-*-x86_64.iso artifacts/SHA256SUMS
